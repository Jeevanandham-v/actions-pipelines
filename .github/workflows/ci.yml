name: notekeeper-ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: pip
      - name: install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python3 -m pytest
